<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============================================
     DESIGN TOKENS
     ============================================ */
  :root{
    --ink:        #14171f;
    --panel:      #1b1f2a;
    --key:        #232838;
    --key-hi:     #2b3145;
    --amber:      #f2a541;
    --amber-dim:  #c98730;
    --mint:       #7fe0b3;
    --text:       #eef0f5;
    --text-dim:   #7a8093;
    --font-ui:    'Space Grotesk', sans-serif;
    --font-num:   'JetBrains Mono', monospace;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 15%, rgba(242,165,65,0.07), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(127,224,179,0.06), transparent 45%),
      var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-ui);
    padding: 32px 16px;
  }

  /* ============================================
     CALCULATOR SHELL
     ============================================ */
  .calc{
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border-radius: 28px;
    padding: 22px;
    box-shadow:
      0 30px 60px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }

  /* ============================================
     HEADER — small brand mark + title
     ============================================ */
  .calc-header{
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 2px 4px 4px;
  }

  .calc-header .dot{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 10px rgba(242,165,65,0.7);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.45; }
  }

  .calc-header h1{
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* ============================================
     DISPLAY — history strip + main readout
     ============================================ */
  .display{
    padding: 26px 18px 20px;
    text-align: right;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 108px;
    justify-content: flex-end;
  }

  .history{
    font-family: var(--font-num);
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    min-height: 18px;
    overflow-wrap: anywhere;
  }

  .readout{
    font-family: var(--font-num);
    font-weight: 500;
    color: var(--text);
    font-size: clamp(32px, 9vw, 44px);
    line-height: 1.1;
    overflow-wrap: anywhere;
    word-break: break-all;
  }

  .readout .cursor{
    display: inline-block;
    width: 2px;
    height: 0.9em;
    background: var(--mint);
    margin-left: 3px;
    vertical-align: -0.08em;
    animation: blink 1.1s step-end infinite;
  }

  @keyframes blink{ 50%{ opacity: 0; } }

  /* ============================================
     KEYPAD
     ============================================ */
  .keypad{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 10px;
  }

  button{
    font-family: var(--font-ui);
    font-size: 19px;
    font-weight: 500;
    border: none;
    border-radius: 16px;
    padding: 15px 0;
    cursor: pointer;
    color: var(--text);
    background: var(--key);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 2px 0 rgba(0,0,0,0.25);
    transition: transform 0.08s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  button:hover{ background: var(--key-hi); }

  button:active{
    transform: translateY(2px) scale(0.97);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .key-op{
    background: rgba(242,165,65,0.12);
    color: var(--amber);
    font-size: 21px;
    font-weight: 600;
  }

  .key-op:hover{ background: rgba(242,165,65,0.2); }

  .key-op.selected{
    background: var(--amber);
    color: var(--ink);
  }

  .key-func{
    background: rgba(127,224,179,0.1);
    color: var(--mint);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .key-func:hover{ background: rgba(127,224,179,0.18); }

  .key-zero{ grid-column: span 2; }

  .key-equals{
    background: linear-gradient(135deg, var(--amber), var(--amber-dim));
    color: var(--ink);
    font-weight: 700;
    font-size: 20px;
    box-shadow: 0 4px 16px rgba(242,165,65,0.3);
  }

  .key-equals:hover{ filter: brightness(1.08); }

  .key-equals:active{ transform: translateY(2px) scale(0.98); }

  /* pressed-via-keyboard feedback */
  button.pressed{
    transform: translateY(2px) scale(0.97);
  }

  /* ============================================
     RESPONSIVE
     ============================================ */
  @media (max-width: 380px){
    .calc{ padding: 16px; border-radius: 22px; }
    button{ padding: 13px 0; font-size: 17px; }
    .display{ padding: 20px 10px 14px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="calc">
  <div class="calc-header">
    <span class="dot"></span>
    <h1>Calculator</h1>
  </div>

  <div class="display">
    <div class="history" id="history">&nbsp;</div>
    <div class="readout" id="readout">0<span class="cursor"></span></div>
  </div>

  <div class="keypad">
    <button class="key-func" data-action="sqrt">√</button>
    <button class="key-func" data-action="square">x²</button>
    <button class="key-func" data-action="reciprocal">1/x</button>
    <button class="key-func" data-action="negate">±</button>

    <button class="key-func" data-action="clear">AC</button>
    <button class="key-func" data-action="delete">⌫</button>
    <button class="key-func" data-action="percent">%</button>
    <button class="key-op" data-action="operator" data-op="÷">÷</button>

    <button data-action="number" data-num="7">7</button>
    <button data-action="number" data-num="8">8</button>
    <button data-action="number" data-num="9">9</button>
    <button class="key-op" data-action="operator" data-op="×">×</button>

    <button data-action="number" data-num="4">4</button>
    <button data-action="number" data-num="5">5</button>
    <button data-action="number" data-num="6">6</button>
    <button class="key-op" data-action="operator" data-op="−">−</button>

    <button data-action="number" data-num="1">1</button>
    <button data-action="number" data-num="2">2</button>
    <button data-action="number" data-num="3">3</button>
    <button class="key-op" data-action="operator" data-op="+">+</button>

    <button class="key-zero" data-action="number" data-num="0">0</button>
    <button data-action="decimal">.</button>
    <button class="key-equals" data-action="equals">=</button>
  </div>
</div>

<script>
/* ============================================================
   1. STATE
   currentOperand  -> the number currently being typed (as a string)
   previousOperand -> the number typed before an operator was chosen
   operation       -> which operator is pending ("+", "−", "×", "÷")
   overwrite       -> true right after "=" or choosing an operator,
                      meaning the next digit should start a fresh number
                      instead of appending to the old one
   ============================================================ */
let currentOperand  = "0";
let previousOperand = "";
let operation       = null;
let overwrite       = false;
let note            = ""; // transient note shown above the readout, e.g. "√(144)"

const readoutEl = document.getElementById("readout");
const historyEl = document.getElementById("history");

/* ============================================================
   2. DISPLAY FORMATTING
   Adds thousands separators (e.g. 1,234.5) without touching the
   underlying value used for maths.
   ============================================================ */
function formatNumber(value){
  if (value === "" || value === "-") return value;
  // Non-numeric readouts (like the divide-by-zero message) are shown as-is
  if (!/^-?\d*\.?\d*$/.test(value)) return value;
  const [intPart, decimalPart] = value.split(".");
  const formattedInt = new Intl.NumberFormat("en-IN").format(intPart === "" || intPart === "-" ? 0 : intPart);
  const sign = intPart.startsWith("-") ? "-" : "";
  const body = sign ? formattedInt.replace("-", "") : formattedInt;
  return (sign ? "-" + body : body) + (decimalPart !== undefined ? "." + decimalPart : "");
}

function updateDisplay(){
  readoutEl.innerHTML = `${formatNumber(currentOperand)}<span class="cursor"></span>`;
  historyEl.textContent = note
    ? note
    : previousOperand
      ? `${formatNumber(previousOperand)} ${operation ?? ""}`
      : "\u00A0"; // non-breaking space keeps the row height stable when empty
}

/* ============================================================
   3. CORE ACTIONS
   ============================================================ */

function inputNumber(num){
  if (currentOperand === "0" || overwrite){
    currentOperand = num;
    overwrite = false;
    note = "";
  } else {
    // Cap length so huge inputs can't overflow the layout
    if (currentOperand.replace("-", "").length >= 15) return;
    currentOperand += num;
  }
}

function inputDecimal(){
  if (overwrite){
    currentOperand = "0.";
    overwrite = false;
    note = "";
    return;
  }
  if (!currentOperand.includes(".")) currentOperand += ".";
}

function chooseOperation(op){
  if (currentOperand === "" ) return;

  // Chaining: if an operation is already pending, resolve it first
  if (previousOperand !== "" && !overwrite){
    compute();
  }

  note = "";
  operation = op;
  previousOperand = currentOperand;
  overwrite = true;
  highlightOperator(op);
}

// Rounds away tiny floating-point errors (e.g. 0.1 + 0.2 -> 0.30000000000000004)
// without truncating results that legitimately need many decimal places
function roundResult(num){
  return String(Math.round((num + Number.EPSILON) * 1e10) / 1e10);
}

function compute(){
  const prev = parseFloat(previousOperand);
  const curr = parseFloat(currentOperand);
  if (isNaN(prev) || isNaN(curr)) return;

  let result;
  switch (operation){
    case "+": result = prev + curr; break;
    case "−": result = prev - curr; break;
    case "×": result = prev * curr; break;
    case "÷":
      if (curr === 0){
        currentOperand = "Can't ÷ 0";
        previousOperand = "";
        operation = null;
        overwrite = true;
        return;
      }
      result = prev / curr;
      break;
    default: return;
  }

  currentOperand = roundResult(result);
  previousOperand = "";
  operation = null;
  overwrite = true;
}

function clearAll(){
  currentOperand = "0";
  previousOperand = "";
  operation = null;
  overwrite = false;
  note = "";
  clearOperatorHighlight();
}

function deleteLast(){
  if (overwrite) return; // don't edit a result that's about to be replaced
  currentOperand = currentOperand.length > 1 ? currentOperand.slice(0, -1) : "0";
}

function percent(){
  currentOperand = String(parseFloat(currentOperand) / 100);
}

/* ---- one-tap functions: each turns the current number straight into
   a result, so overwrite is set to true and a short note explains
   what just happened above the readout ---- */

function sqrtOp(){
  const val = parseFloat(currentOperand);
  note = `√(${formatNumber(currentOperand)})`;
  currentOperand = val < 0 ? "Error" : roundResult(Math.sqrt(val));
  overwrite = true;
}

function squareOp(){
  const val = parseFloat(currentOperand);
  note = `sqr(${formatNumber(currentOperand)})`;
  currentOperand = roundResult(val * val);
  overwrite = true;
}

function reciprocalOp(){
  const val = parseFloat(currentOperand);
  note = `1/(${formatNumber(currentOperand)})`;
  currentOperand = val === 0 ? "Error" : roundResult(1 / val);
  overwrite = true;
}

// Flips the sign of the number currently being typed or shown.
// Unlike the functions above, this doesn't "finish" the number —
// you can keep typing digits right after using it.
function toggleSign(){
  if (currentOperand === "0" || isNaN(parseFloat(currentOperand))) return;
  currentOperand = currentOperand.startsWith("-")
    ? currentOperand.slice(1)
    : "-" + currentOperand;
}

function highlightOperator(op){
  clearOperatorHighlight();
  const btn = document.querySelector(`.key-op[data-op="${op}"]`);
  if (btn) btn.classList.add("selected");
}

function clearOperatorHighlight(){
  document.querySelectorAll(".key-op.selected").forEach(b => b.classList.remove("selected"));
}

/* ============================================================
   4. BUTTON CLICKS — one delegated listener on the keypad
   ============================================================ */
document.querySelector(".keypad").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  handleAction(btn.dataset.action, btn.dataset);
  flashKey(btn);
});

function handleAction(action, data){
  switch (action){
    case "number":      inputNumber(data.num); break;
    case "decimal":     inputDecimal(); break;
    case "operator":    chooseOperation(data.op); break;
    case "equals":      compute(); clearOperatorHighlight(); break;
    case "clear":       clearAll(); break;
    case "delete":      deleteLast(); break;
    case "percent":     percent(); break;
    case "sqrt":        sqrtOp(); break;
    case "square":      squareOp(); break;
    case "reciprocal":  reciprocalOp(); break;
    case "negate":      toggleSign(); break;
  }
  updateDisplay();
}

// brief visual "press" feedback, used for both mouse and keyboard input
function flashKey(btn){
  btn.classList.add("pressed");
  setTimeout(() => btn.classList.remove("pressed"), 100);
}

/* ============================================================
   5. KEYBOARD SUPPORT (bonus requirement)
   ============================================================ */
const KEY_MAP = {
  "+": { action: "operator", op: "+" },
  "-": { action: "operator", op: "−" },
  "*": { action: "operator", op: "×" },
  "/": { action: "operator", op: "÷" },
  "%": { action: "percent" },
  ".": { action: "decimal" },
  "Enter": { action: "equals" },
  "=": { action: "equals" },
  "Backspace": { action: "delete" },
  "Escape": { action: "clear" },
};

document.addEventListener("keydown", e => {
  let action, data = {};

  if (e.key >= "0" && e.key <= "9"){
    action = "number";
    data.num = e.key;
  } else if (KEY_MAP[e.key]){
    action = KEY_MAP[e.key].action;
    if (KEY_MAP[e.key].op) data.op = KEY_MAP[e.key].op;
  } else {
    return; // ignore any key we don't handle
  }

  e.preventDefault();
  handleAction(action, data);

  // find the matching on-screen button (if any) to flash it too
  let selector = `[data-action="${action}"]`;
  if (data.op) selector = `.key-op[data-op="${data.op}"]`;
  if (action === "number") selector = `[data-action="number"][data-num="${data.num}"]`;
  const btn = document.querySelector(selector);
  if (btn) flashKey(btn);
});

/* ============================================================
   6. INIT
   ============================================================ */
updateDisplay();
</script>

</body>
</html>
